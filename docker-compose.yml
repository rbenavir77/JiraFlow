services:
  backend:
    build: ./backend
    container_name: jiraflow-backend
    # Inyecta las credenciales (Jira, OpenRouter/OpenAI, calendario) como variables
    # de entorno. El código las lee con os.getenv.
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: jiraflow-frontend
    ports:
      - "3000:3000"
    # Montamos el código para hot reload; node_modules queda en un volumen
    # propio del contenedor (no lo pisa el host).
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  frontend_node_modules:
